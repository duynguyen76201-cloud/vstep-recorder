
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSTEP Speaking Recorder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #1f2937;
  }
  .container {
    max-width: 760px;
    margin: 25px auto;
    background: white;
    padding: 26px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,.06);
  }
  h1 { color: #17365d; font-size: 25px; }
  .label { color: #2563eb; font-weight: bold; }
  .question {
    background: #f7f9fc;
    border-left: 4px solid #2563eb;
    padding: 15px;
    margin: 12px 0;
    border-radius: 7px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .timer {
    font-size: 46px;
    font-weight: bold;
    color: #17365d;
    margin: 18px 0;
    font-variant-numeric: tabular-nums;
  }
  .warning { color: #dc2626; }
  .status {
    padding: 14px;
    border-radius: 9px;
    background: #f1f5f9;
    margin: 18px 0;
    line-height: 1.5;
  }
  button {
    border: 0;
    border-radius: 9px;
    padding: 14px 20px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hidden { display: none; }
  .error { color: #dc2626; }
  .success { color: #16845b; }
  @media(max-width: 600px) {
    body { padding: 10px; }
    .container { padding: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="label" id="partLabel">VSTEP SPEAKING</div>
  <h1 id="title">Preparing recorder...</h1>

  <div id="questionArea" class="question">
    Please wait while the exam question is loading.
  </div>

  <div id="timerLabel">Status</div>
  <div id="timer" class="timer">--:--</div>

  <div id="status" class="status">
    Connecting to the examination page...
  </div>

  <button id="startButton" disabled>Start recording session</button>
</div>

<script>
"use strict";

let examConfig = null;
let mediaStream = null;
let mediaRecorder = null;
let chunks = [];
let timerInterval = null;
let remainingSeconds = 0;
let initialized = false;
let finished = false;

const startButton = document.getElementById("startButton");
const statusBox = document.getElementById("status");
const timerDisplay = document.getElementById("timer");
const timerLabel = document.getElementById("timerLabel");

function sendToParent(type, data = {}) {
  if (!window.opener || window.opener.closed) return;

  window.opener.postMessage({
    type,
    ...data
  }, "*");
}

function notifyReady() {
  sendToParent("VSTEP_RECORDER_READY");
}

// Send READY repeatedly because the main page may not be ready
// when this page first loads.
notifyReady();
const readyInterval = setInterval(() => {
  if (!initialized) notifyReady();
  else clearInterval(readyInterval);
}, 700);

window.addEventListener("message", event => {
  if (event.source !== window.opener) return;

  const data = event.data || {};

  if (data.type === "VSTEP_RECORDER_INIT") {
    if (initialized) return;

    initialized = true;
    examConfig = data.config;

    document.getElementById("partLabel").textContent =
      examConfig.partLabel || examConfig.part || "VSTEP SPEAKING";

    document.getElementById("title").textContent =
      examConfig.title || "Speaking examination";

    document.getElementById("questionArea").textContent =
      examConfig.question || "No question provided.";

    statusBox.textContent =
      "The exam is ready. Click the button below to allow microphone access and begin.";

    startButton.disabled = false;
  }

  if (data.type === "VSTEP_UPLOAD_SUCCESS") {
    statusBox.textContent =
      "Your recording has been uploaded successfully. You can return to the examination page.";
    statusBox.className = "status success";
    startButton.disabled = true;
  }

  if (data.type === "VSTEP_UPLOAD_FAILED") {
    statusBox.textContent =
      "The upload failed. Return to the examination page and use Retry upload.";
    statusBox.className = "status error";
  }
});

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;

  return String(min).padStart(2, "0") + ":" +
         String(sec).padStart(2, "0");
}

function updateTimer(label, seconds) {
  timerLabel.textContent = label;
  timerDisplay.textContent = formatTime(seconds);
  timerDisplay.classList.toggle("warning", seconds <= 15);

  sendToParent("VSTEP_TIMER", {
    label,
    remaining: seconds
  });
}

function runCountdown(seconds, label, callback) {
  clearInterval(timerInterval);

  remainingSeconds = seconds;
  updateTimer(label, remainingSeconds);

  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimer(label, remainingSeconds);

    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      callback();
    }
  }, 1000);
}

function chooseMimeType() {
  const types = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/mp4",
    "audio/ogg;codecs=opus"
  ];

  for (const type of types) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }

  return "";
}

async function startSession() {
  if (!examConfig || finished) return;

  startButton.disabled = true;

  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        "This browser does not support microphone access. Please use Chrome or Safari."
      );
    }

    statusBox.textContent = "Requesting microphone permission...";

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    statusBox.textContent = "Microphone connected successfully.";

    if (Number(examConfig.prepSeconds) > 0) {
      runCountdown(
        Number(examConfig.prepSeconds),
        "Preparation time",
        startRecording
      );
    } else {
      startRecording();
    }

  } catch (err) {
    statusBox.textContent =
      "Cannot access microphone: " + err.message;
    statusBox.className = "status error";
    startButton.disabled = false;
  }
}

function startRecording() {
  try {
    chunks = [];

    const mimeType = chooseMimeType();

    mediaRecorder = mimeType
      ? new MediaRecorder(mediaStream, { mimeType })
      : new MediaRecorder(mediaStream);

    mediaRecorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    mediaRecorder.onerror = event => {
      statusBox.textContent =
        "Recording error: " +
        (event.error ? event.error.message : "Unknown error");
      statusBox.className = "status error";
    };

    mediaRecorder.onstop = sendRecording;

    mediaRecorder.start(1000);

    statusBox.textContent =
      "Recording is in progress. Speak clearly and answer the questions.";
    statusBox.className = "status";

    startButton.textContent = "Recording...";
    startButton.disabled = true;

    runCountdown(
      Number(examConfig.speakSeconds),
      "Speaking time",
      stopRecording
    );

  } catch (err) {
    statusBox.textContent =
      "Cannot start recording: " + err.message;
    statusBox.className = "status error";
    startButton.disabled = false;
  }
}

function stopRecording() {
  clearInterval(timerInterval);
  timerInterval = null;

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

function sendRecording() {
  if (finished) return;

  finished = true;

  const type = mediaRecorder && mediaRecorder.mimeType
    ? mediaRecorder.mimeType
    : "audio/webm";

  const blob = new Blob(chunks, { type });

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  if (blob.size < 1000) {
    statusBox.textContent =
      "The recording is too short or empty. Please return to the exam page.";
    statusBox.className = "status error";
    return;
  }

  if (blob.size > 6 * 1024 * 1024) {
    statusBox.textContent =
      "The recording exceeds the 6 MB limit. Please contact the test administrator.";
    statusBox.className = "status error";
    return;
  }

  statusBox.textContent =
    "Recording completed. Sending it to the examination page...";

  sendToParent("VSTEP_AUDIO_READY", {
    part: examConfig.part,
    mimeType: type,
    blob
  });

  timerLabel.textContent = "Recording completed";
  timerDisplay.textContent = "DONE";
  startButton.textContent = "Recording sent";
}

startButton.addEventListener("click", startSession);

window.addEventListener("beforeunload", () => {
  clearInterval(timerInterval);

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
</html>
